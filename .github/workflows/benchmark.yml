name: Benchmark harness

on:
  pull_request:
    paths:
      - 'benchmarks/**'
      - 'skills/**'
      - 'rules/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: bun run benchmark:typecheck
      - run: bun run benchmark:test
      - run: bun run benchmark --dry-run --runs 1 --output benchmarks/results/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-dry-run
          path: benchmarks/results/ci/
