id: kamae-review-broad-operation-contracts-001
name: Review task dependency responsibilities
description: |
  Detect mixed read/write contracts and independent operations bundled into
  either a resolver or a store, even when file placement is correct.

inputs:
  prompt: |
    Use kamae-review to review the attached snapshot for dependency contract
    responsibilities and consumer coupling only. Report findings with file
    locations and severity (High / Medium / Low), impact, and concrete fixes.
    Do not review omitted implementations or already-reviewed domain types.
    If this scope has no violations, say "No findings".
  files:
    - path: architecture/task-operation-contracts.md

expected:
  outcomes:
    - type: task_completed

graders:
  - type: text
    name: identifies_all_three_overbroad_contracts
    config:
      regex_match:
        - 'task-event-store\.ts'
        - 'task-resolver\.ts'
        - 'task-state-store\.ts'
        - '\bLow\b'
