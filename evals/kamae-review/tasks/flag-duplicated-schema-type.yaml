id: kamae-review-schema-type-inference-001
name: Flag a hand-written type that duplicates a schema
description: |
  Adversarial case. The fixture maintains a Zod schema and a matching
  hand-written type as two sources of truth. The reviewer should explain the
  drift risk and recommend deriving the type from the schema.

inputs:
  prompt: |
    Review the attached TypeScript file as part of a pull request and report
    findings against the kamae principles. Cite the relevant principle for
    each finding and tag severity (High / Medium / Low / Suggestion).
  files:
    - path: violations/duplicated-schema-type.ts

expected:
  outcomes:
    - type: task_completed

graders:
  - type: text
    name: identifies_duplicated_schema_type
    config:
      regex_match:
        - '(?i)duplicat(?:e|ed|ion)|two sources of truth|restat(?:e|es|ed|ing)|二重管理'
        - '(?i)\bdrift(?:s|ed|ing)?\b|out of sync|(?:single|one) source of truth|ずれ|唯一の情報源'
  - type: text
    name: recommends_schema_inference
    config:
      regex_match:
        - '(?i)z\.(?:infer|input|output)\s*<\s*typeof\s+CreateTaskInputSchema\s*>'
  - type: text
    name: defaults_matching_definitions_to_low
    config:
      regex_match:
        - '(?is)(?:^|\n)#{1,6}\s*(?:\[\s*)?Low\b(?:\s*\])?(?=(?:(?!\n#{1,6}\s*(?:\[\s*)?(?:High|Medium|Low|Suggestion)\b).){0,800}\bCreateTaskInput\b)(?=(?:(?!\n#{1,6}\s*(?:\[\s*)?(?:High|Medium|Low|Suggestion)\b).){0,800}\bCreateTaskInputSchema\b)(?=(?:(?!\n#{1,6}\s*(?:\[\s*)?(?:High|Medium|Low|Suggestion)\b).){0,800}(?:\bduplicat(?:e|ed|ion)\b|two sources of truth|\brestat(?:e|es|ed|ing)\b|二重管理))(?:(?!\n#{1,6}\s*(?:\[\s*)?(?:High|Medium|Low|Suggestion)\b).){0,800}'
