id: kamae-review-renamed-catch-all-result-001
name: Flag renamed catch-all technical faults in domain Results
description: |
  Adversarial case. An arbitrary repository rejection is caught and converted
  into a generic technical error in a domain Result union, but neither the type
  nor its payload uses the RepositoryError/cause spelling. Review must identify
  the structure independently of identifier names.

inputs:
  prompt: |
    Review the attached TypeScript file as part of a pull request and report
    findings against the kamae principles. Cite the relevant principle for
    each finding and tag severity (High / Medium / Low / Suggestion).
    Include one finding bullet beginning `Medium:` or `[P2]` that, on the same
    line, identifies the fixture's renamed catch-all technical error, explains
    that arbitrary or unknown repository faults do not belong in a domain
    `Result` without documented recovery, and requires the fault to propagate.
  files:
    - path: violations/renamed-catch-all-as-domain-result.ts

expected:
  outcomes:
    - type: task_completed

graders:
  - type: text
    name: reports_renamed_catch_all_as_domain_result
    config:
      regex_match:
        - "(?im)^\\s*(?:[-*]\\s+|\\d+[.)]\\s+)(?:\\*{1,2})?(?:Medium|\\[P2\\])(?:\\*{1,2})?(?:\\s*[:—-]\\s*)?(?=[^\\n]*PersistenceFailure)(?=[^\\n]*(?:catch-all|generic|arbitrary|unknown))(?=[^\\n]*\\bResult\\b)(?=[^\\n]*(?:documented\\s+(?:\\w+\\s+){0,2}recovery|recoverable))(?=[^\\n]*propagat)[^\\n]*$"
