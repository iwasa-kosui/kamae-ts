id: kamae-review-thrown-business-error-001
name: Flag thrown business failures in domain code
description: |
  Adversarial case. InvalidState and invalid input are expected failures that
  must be returned as Result, not thrown as exceptions. The fixture also uses
  `as` to cast at the boundary, which should remain a separate finding.

inputs:
  prompt: |
    Review the attached TypeScript file as part of a pull request and report
    findings against the kamae principles. Cite the relevant principle for
    each finding and tag severity (High / Medium / Low / Suggestion).
    Include one finding bullet beginning `Medium:` or `[P2]` that, on the same
    line, identifies the thrown expected business/validation failure and
    requires a `Result` remediation. Separately include one finding bullet
    that identifies the `as` cast and gives an actionable schema-validation
    remediation on the same line (for example, missing validation, replacing
    the cast, or parsing with schema validation).
  files:
    - path: violations/throw-domain-error.ts

expected:
  outcomes:
    - type: task_completed

graders:
  - type: text
    name: reports_thrown_business_error
    config:
      regex_match:
        - "(?im)^\\s*(?:[-*]\\s+|\\d+[.)]\\s+)(?:\\*{1,2})?(?:Medium|\\[P2\\])(?:\\*{1,2})?(?:\\s*[:—-]\\s*)?(?=[^\\n]*(?:\\bInvalidState\\b|invalid\\s+input|expected\\s+business(?:\\s+failure)?|business-state(?:\\s+failure)?|validation(?:\\s+(?:failure|error))?))(?=[^\\n]*(?:throw(?:n|ing)?|exception))(?=[^\\n]*\\bResult\\b)[^\\n]*$"
  - type: text
    name: reports_boundary_cast_schema_validation_violation
    config:
      regex_match:
        - "(?im)^\\s*(?:[-*]\\s+|\\d+[.)]\\s+)(?:\\*{1,2})?(?:High|Medium|Low|Suggestion|\\[P[0-3]\\])(?:\\*{1,2})?(?:\\s*[:—-]\\s*)?(?=[^\\n]*(?:\\bas\\b|cast|type\\s+assertion))(?=[^\\n]*schema\\s+validation)(?=[^\\n]*(?:(?:missing|without|lack(?:s|ing)?)\\b[^\\n]{0,80}schema\\s+validation|schema\\s+validation[^\\n]{0,80}\\b(?:missing|absent|replace|parse|validate|use|add|introduce|require)\\b|\\b(?:replace|parse|validate|use|add|introduce|require)\\b[^\\n]{0,80}schema\\s+validation))[^\\n]*$"
