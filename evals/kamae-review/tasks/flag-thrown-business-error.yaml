id: kamae-review-thrown-business-error-001
name: Flag thrown business failures in domain code
description: |
  Adversarial case. InvalidState and invalid input are expected failures that
  must be returned as Result, not thrown as exceptions. The fixture also uses
  `as` to cast at the boundary, which should remain a separate finding.

inputs:
  prompt: |
    Review the attached TypeScript file as part of a pull request and report
    findings against the kamae principles. Cite the relevant principle for
    each finding and tag severity (High / Medium / Low / Suggestion).
  files:
    - path: violations/throw-domain-error.ts

expected:
  outcomes:
    - type: task_completed

graders:
  - type: text
    name: reports_thrown_business_error
    config:
      regex_match:
        - "(?is)(?:\\bMedium\\b|\\[P2\\])(?=(?:(?!\\b(?:High|Medium|Low|Suggestion)\\b|\\[P[0-3]\\]).){0,600}?(?:InvalidState|invalid\\s+input))(?=(?:(?!\\b(?:High|Medium|Low|Suggestion)\\b|\\[P[0-3]\\]).){0,600}?(?:throw(?:n|ing)?|exception))(?=(?:(?!\\b(?:High|Medium|Low|Suggestion)\\b|\\[P[0-3]\\]).){0,600}?\\bResult\\b)(?:(?!\\b(?:High|Medium|Low|Suggestion)\\b|\\[P[0-3]\\]).){0,600}"
  - type: text
    name: reports_boundary_cast_schema_validation_violation
    config:
      regex_match:
        - "(?is)(?:\\b(?:High|Medium|Low|Suggestion)\\b|\\[P[0-3]\\])(?=(?:(?!\\b(?:High|Medium|Low|Suggestion)\\b|\\[P[0-3]\\]).){0,600}?(?:\\bas\\b|cast|type\\s+assertion))(?=(?:(?!\\b(?:High|Medium|Low|Suggestion)\\b|\\[P[0-3]\\]).){0,600}?(?:boundary|schema|validat))(?:(?!\\b(?:High|Medium|Low|Suggestion)\\b|\\[P[0-3]\\]).){0,600}"
