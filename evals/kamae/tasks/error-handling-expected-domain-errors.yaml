id: kamae-error-handling-001
name: Model expected domain errors as Results
description: |
  Positive case. Asks the agent to model expected business failures as a
  use-case-specific discriminated union returned through Result, while keeping
  unclassified infrastructure failures outside that union.

inputs:
  prompt: |
    Implement an `assignDriver` use case in TypeScript.

    Inputs:
      - taxiRequestId: TaxiRequestId (branded)
      - driverId: DriverId (branded)

    Define a closed use-case-specific `AssignDriverError` union with exactly
    these named business-error members:
      - RequestNotFound
      - InvalidState
      - DriverNotAvailable
    Express the union as
    `type AssignDriverError = RequestNotFound | InvalidState | DriverNotAvailable`.

    Make the `assignDriver` public contract use this canonical shape:

    ```ts
    type AssignDriver = (command: AssignDriverCommand) => Promise<Result<AssignedDriver, AssignDriverError>>;
    export const assignDriver: AssignDriver = async (command) => {
      // ...
    };
    ```

    Callers must branch on the `Result` failure exhaustively. Do not widen that
    `Result` error type with any other member. An unclassified database timeout,
    configuration defect, or unknown SDK failure is not a business error: let
    it propagate as a thrown or rejected failure instead of representing it in
    any `Result` error member. In particular, do not introduce a catch-all
    error variant such as `RepositoryError`, `InfrastructureError`, or
    `UnknownFailure`.

    Use the project's dependencies (see package.json).
  files:
    - path: package.json

expected:
  outcomes:
    - type: task_completed

graders:
  - type: text
    name: expected_business_errors_are_results
    config:
      regex_match:
        - "(?m)type\\s+AssignDriverError\\s*=\\s*RequestNotFound\\s*\\|\\s*InvalidState\\s*\\|\\s*DriverNotAvailable\\s*;"
        - "(?m)type\\s+AssignDriver\\s*=\\s*\\(\\s*command\\s*:\\s*AssignDriverCommand\\s*\\)\\s*=>\\s*Promise\\s*<\\s*Result\\s*<\\s*AssignedDriver\\s*,\\s*AssignDriverError\\s*>\\s*>\\s*;"
        - "(?m)export\\s+const\\s+assignDriver\\s*:\\s*AssignDriver\\s*=\\s*async\\s*\\(\\s*command\\s*\\)\\s*=>"
      regex_not_match:
        - "RepositoryError"
        - "throw\\s+new\\s+\\w*Error\\b"
  - type: text
    name: unclassified_infrastructure_failures_propagate
    config:
      regex_match:
        - "(?:throw\\s+[A-Za-z_$][\\w$]*|Promise\\.reject\\s*\\(\\s*[A-Za-z_$][\\w$]*\\s*\\))"
      regex_not_match:
        - "(?i)(?:repository|infrastructure|unknown|unexpected)(?:_)?(?:error|failure)"
        - "(?i)(?:database(?:_)?timeout|configuration(?:_)?(?:error|defect)|sdk(?:_)?(?:error|failure))"
