id: kamae-event-only-store-001
name: Record supplied task events
description: |
  Check that an event-only consumer receives just one write operation, without
  inventing a resolver, aggregate-state write, or additional store methods.

inputs:
  prompt: |
    Use kamae to define the dependency contract and implement recordTaskEvents
    for a new server-side TypeScript service using zod and neverthrow. The
    caller supplies validated immutable TaskEvent values, including event IDs
    and timestamps. This operation only appends these supplied events to durable
    storage. Assume TaskEvent is imported. There is no project override.
    Return TypeScript code only. Do not implement a database adapter.
  files: []

expected:
  outcomes:
    - type: task_completed

graders:
  - type: text
    name: defines_event_write_contract
    config:
      regex_match:
        - 'type\s+\w*Store\b'
        - 'readonly\s+TaskEvent\[\]|ReadonlyArray<TaskEvent>'
      regex_not_match:
        - 'type\s+\w*Resolver\b'
